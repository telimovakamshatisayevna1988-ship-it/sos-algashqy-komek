<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c62828">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>SOS Көмек</title>
<style>
:root{
--bg:#f6f7f9; --card:#ffffff; --text:#1b1f24; --muted:#5b6670; --line:#e3e6ea;
--red:#c62828; --red2:#e53935; --amber:#f9a825; --green:#2e7d32; --blue:#1565c0; --yellow:#ffd600;
--fs:16px;
}
:root[data-theme="dark"]{
--bg:#0f1317; --card:#1a2027; --text:#eef1f4; --muted:#9aa6b2; --line:#2a323b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;font-size:var(--fs)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f6f7f9;background:var(--bg);color:#1b1f24;color:var(--text);line-height:1.5;padding-bottom:90px}
header{background:#c62828;background:var(--red);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:1.15rem;margin:0}
header .tools{display:flex;align-items:center}
header .tools button,header .tools select{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:9px 10px;font-size:1rem;margin-left:6px}
header .tools select option{color:#111}
main{max-width:640px;margin:0 auto;padding:16px}
.screen{display:none}.screen.active{display:block}
nav{position:fixed;bottom:0;left:0;right:0;background:#ffffff;background:var(--card);border-top:1px solid #e3e6ea;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;padding:9px 2px;color:#5b6670;color:var(--muted);font-size:.74rem}
nav button .i{display:block;font-size:1.35rem}
nav button.active{color:#c62828;color:var(--red);font-weight:700}
.sos-wrap{text-align:center;margin:8px 0 16px}
.sos{width:72vw;height:72vw;max-width:280px;max-height:280px;border-radius:50%;border:8px solid #ffd600;border:8px solid var(--yellow);background:radial-gradient(circle at 35% 30%,#e53935,#c62828);background:radial-gradient(circle at 35% 30%,var(--red2),var(--red));color:#fff;font-weight:800;box-shadow:0 0 0 10px rgba(198,40,40,.18),0 12px 34px rgba(198,40,40,.5);animation:pulse 2s infinite}
.sos .sos-t{display:block;font-size:4rem;letter-spacing:3px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.sos small{display:block;font-size:1rem;font-weight:600;letter-spacing:0;margin-top:2px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 10px rgba(198,40,40,.18),0 12px 34px rgba(198,40,40,.5)}50%{box-shadow:0 0 0 22px rgba(198,40,40,.06),0 12px 34px rgba(198,40,40,.5)}}
.card{background:#ffffff;background:var(--card);border:1px solid #e3e6ea;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:1.05rem}
.h2s{font-size:1.05rem}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:15px;min-height:52px;font-size:1.05rem;font-weight:700;margin-top:10px;color:#fff;background:#1565c0;background:var(--blue)}
.btn.red{background:#c62828;background:var(--red)}.btn.green{background:#2e7d32;background:var(--green)}.btn.gray{background:#5b6670;background:var(--muted)}
.btn.yellow{background:#ffd600;background:var(--yellow);color:#111}
.btn.big{font-size:1.35rem;padding:18px;margin-bottom:6px}
.filebtn{cursor:pointer}
.hidefile{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.center{text-align:center}
.grid{display:flex;flex-wrap:wrap;margin:-4px}.grid>.num{width:calc(50% - 8px);margin:4px}
.num{display:block;text-decoration:none;color:#1b1f24;color:var(--text);background:#ffffff;background:var(--card);border:1px solid #e3e6ea;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.num b{display:block;font-size:1.8rem;color:#c62828;color:var(--red)}
.num span{font-size:.85rem;color:#5b6670;color:var(--muted)}
.muted{color:#5b6670;color:var(--muted);font-size:.9rem}
input[type=text],input[type=tel],input[type=search],textarea{width:100%;padding:13px;border:1px solid #e3e6ea;border:1px solid var(--line);border-radius:12px;background:#ffffff;background:var(--card);color:#1b1f24;color:var(--text);font-size:1rem;margin-top:8px;font-family:inherit}
.chips{display:flex;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;border:1px solid #e3e6ea;border:1px solid var(--line);background:#ffffff;background:var(--card);color:#1b1f24;color:var(--text);border-radius:999px;padding:9px 14px;font-size:.9rem;margin-right:6px}
.chip.on{background:#1b1f24;background:var(--text);color:#f6f7f9;color:var(--bg)}
.item{display:flex;align-items:center;width:100%;text-align:left;background:#ffffff;background:var(--card);border:1px solid #e3e6ea;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;color:#1b1f24;color:var(--text);font-size:1rem;min-height:56px}
.item .e{font-size:1.6rem;margin-right:12px}
.item .t{flex:1;font-weight:600}
.tag{font-size:.72rem;border-radius:999px;padding:3px 9px;color:#fff;margin-left:8px;white-space:nowrap}
.u-r{background:#c62828;background:var(--red)}.u-y{background:#b8860b}.u-g{background:#2e7d32;background:var(--green)}
.back{background:none;border:0;color:#1565c0;color:var(--blue);font-size:1.05rem;padding:8px 0;margin-bottom:6px}
.sec{border-left:5px solid #e3e6ea;border-left:5px solid var(--line);padding:2px 0 2px 12px;margin:14px 0}
.sec h3{margin:0 0 4px;font-size:1.02rem}
.sec ol,.sec ul{margin:4px 0;padding-left:20px}
.sec li{margin:6px 0}
.sec.do{border-color:#2e7d32;border-color:var(--green)}.sec.dont{border-color:#c62828;border-color:var(--red)}.sec.call{border-color:#f9a825;border-color:var(--amber)}.sec.sym{border-color:#1565c0;border-color:var(--blue)}
.notr{background:#ffffff;background:var(--card);border:1px dashed #f9a825;border:1px dashed var(--amber);border-radius:12px;padding:10px;font-size:.9rem;margin:10px 0}
.warn{font-size:.82rem;color:#5b6670;color:var(--muted);text-align:center;margin:18px 0}
.metro{text-align:center}
.beat{width:90px;height:90px;border-radius:50%;background:#c62828;background:var(--red);margin:12px auto;transition:transform .08s}
.beat.on{transform:scale(1.25)}
.bpmline{font-size:1.5rem;font-weight:700}
.range{width:80%}
#cprSteps{padding-left:20px}
#cprSteps li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:12px;font-size:.92rem;display:none;z-index:9;max-width:90%}
.contact{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e3e6ea;border-bottom:1px solid var(--line)}
.contact button{background:none;border:0;color:#c62828;color:var(--red);font-size:1.2rem;padding:8px}
.qprog{font-size:.88rem;color:#5b6670;color:var(--muted);margin-bottom:6px}
.qtext{font-size:1.1rem;font-weight:700;margin:4px 0 8px}
.opt{display:block;width:100%;text-align:left;background:#f6f7f9;background:var(--bg);color:#1b1f24;color:var(--text);border:2px solid #e3e6ea;border:2px solid var(--line);border-radius:12px;padding:13px;margin-top:8px;font-size:1rem}
.opt.ok{border-color:#2e7d32;border-color:var(--green);background:rgba(46,125,50,.15)}
.opt.no{border-color:#c62828;border-color:var(--red);background:rgba(198,40,40,.15)}
.qexp{margin-top:12px;padding:10px;border-radius:10px;background:#f6f7f9;background:var(--bg);font-size:.95rem}
.qscore{font-size:1.6rem;font-weight:800;text-align:center;margin:10px 0}

</style>
</head>
<body>

<header>
  <h1 data-i18n="appName">SOS Көмек</h1>
  <div class="tools">
    <select id="lang" aria-label="Language">
      <option value="kk">ҚАЗ</option>
      <option value="ru">РУС</option>
      <option value="en">ENG</option>
    </select>
    <button id="btnTheme" data-i18n-aria="themeAria" aria-label="Түнгі режим">🌙</button>
    <button id="btnFont" data-i18n-aria="fontAria" aria-label="Қаріпті үлкейту">A+</button>
  </div>
</header>

<main>
  <!-- БАСТЫ -->
  <section id="s-home" class="screen active">
    <div class="sos-wrap">
      <button class="sos" id="btnSOS"><span class="sos-t">SOS</span><small data-i18n="tapHere">басыңыз</small></button>
    </div>
    <a class="btn yellow big" href="tel:112" data-i18n="call112">📞 112-ге қоңырау шалу</a>
    <p class="muted center" data-i18n="homeHint"></p>

    <div class="card" id="panelSOS" style="display:none">
      <h2 data-i18n="panelTitle"></h2>
      <a class="btn red" href="tel:112" data-i18n="call112"></a>
      <div id="locStatus" class="muted" style="margin-top:10px"></div>
      <div id="sendBox"></div>
      <button class="btn gray" id="btnCopyLoc" data-i18n="copyLoc"></button>
      <p class="muted" data-i18n="callTell"></p>
    </div>

    <h2 class="h2s" data-i18n="numbersTitle"></h2>
    <div class="grid">
      <a class="num" href="tel:112"><b>112</b><span data-i18n="n112"></span></a>
      <a class="num" href="tel:103"><b>103</b><span data-i18n="n103"></span></a>
      <a class="num" href="tel:101"><b>101</b><span data-i18n="n101"></span></a>
      <a class="num" href="tel:102"><b>102</b><span data-i18n="n102"></span></a>
    </div>
    <p class="warn" data-i18n="disclaimer"></p>
  </section>

  <!-- НҰСҚАУЛЫҚ ТІЗІМІ -->
  <section id="s-guides" class="screen">
    <input type="search" id="q" data-i18n-ph="searchPh">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <!-- НҰСҚАУЛЫҚ ТОЛЫҚ -->
  <section id="s-detail" class="screen">
    <button class="back" id="btnBack" data-i18n="back"></button>
    <div id="detail"></div>
  </section>

  <!-- CPR -->
  <section id="s-cpr" class="screen">
    <div class="card metro">
      <h2 data-i18n="cprTitle"></h2>
      <p class="muted" data-i18n="cprDesc"></p>
      <div class="beat" id="beat"></div>
      <div class="bpmline"><span id="bpm">110</span> <span data-i18n="bpmUnit"></span></div>
      <input type="range" id="bpmRange" min="100" max="120" value="110" class="range" aria-label="BPM">
      <button class="btn red" id="btnMetro" data-i18n="start"></button>
      <a class="btn gray" href="tel:112" data-i18n="cprCallFirst"></a>
    </div>
    <div class="card">
      <h2 data-i18n="cprStepsTitle"></h2>
      <ol id="cprSteps"></ol>
      <p class="muted" data-i18n="cprNote"></p>
      <button class="btn gray" id="btnCprSpeak" data-i18n="cprSpeak"></button>
    </div>
  </section>

  <!-- ТЕСТ -->
  <section id="s-quiz" class="screen">
    <div class="card" id="quizBox"></div>
  </section>

  <!-- ЖАҚЫНДАР -->
  <section id="s-contacts" class="screen">
    <div class="card">
      <h2 data-i18n="ctTitle"></h2>
      <p class="muted" data-i18n="ctDesc"></p>
      <div id="contactList"></div>
      <input type="text" id="cName" data-i18n-ph="namePh">
      <input type="tel" id="cPhone" data-i18n-ph="phonePh">
      <button class="btn green" id="btnAddContact" data-i18n="add"></button>
    </div>
    <div class="card">
      <h2 data-i18n="medTitle"></h2>
      <p class="muted" data-i18n="medDesc"></p>
      <input type="text" id="mBlood" data-i18n-ph="bloodPh">
      <input type="text" id="mAllergy" data-i18n-ph="allergyPh">
      <input type="text" id="mMeds" data-i18n-ph="medsPh">
      <button class="btn green" id="btnSaveMed" data-i18n="save"></button>
    </div>
    <div class="card">
      <h2 data-i18n="bkTitle"></h2>
      <p class="muted" data-i18n="bkDesc"></p>
      <button class="btn" id="btnExport" data-i18n="bkExport"></button>
      <button class="btn gray" id="btnBackupCopy" data-i18n="bkCopy"></button>
      <label class="btn gray filebtn" for="fileImport" data-i18n="bkImportFile"></label>
      <input type="file" id="fileImport" accept=".json,application/json,text/plain" class="hidefile">
      <textarea id="backupText" rows="3" data-i18n-ph="bkPastePh"></textarea>
      <button class="btn gray" id="btnRestore" data-i18n="bkRestore"></button>
    </div>
    <div class="card">
      <h2 data-i18n="shareTitle"></h2>
      <p class="muted" data-i18n="shareDesc"></p>
      <button class="btn" id="btnShare" data-i18n="shareBtn"></button>
    </div>
  </section>
</main>

<nav>
  <button data-go="home" class="active"><span class="i">🆘</span><span data-i18n="navSOS">SOS</span></button>
  <button data-go="guides"><span class="i">📖</span><span data-i18n="navGuides"></span></button>
  <button data-go="cpr"><span class="i">❤️</span><span data-i18n="navCPR">CPR</span></button>
  <button data-go="quiz"><span class="i">📝</span><span data-i18n="navQuiz"></span></button>
  <button data-go="contacts"><span class="i">👤</span><span data-i18n="navMe"></span></button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============ НҰСҚАУЛЫҚ ДЕРЕКТЕРІ ============
   Дереккөз: «Алғашқы медициналық көмек нұсқаулығы» (25 жағдай + қосымша).
   Жаңа жағдай қосу үшін төмендегі тізімге осындай блок қосыңыз.
   u: 'r' = шұғыл (қызыл), 'y' = маңызды (сары), 'g' = жеңіл (жасыл) */
var GUIDES = [
 {id:"cpr",e:"❤️",t:"Жүрек тоқтауы",u:"r",
  sym:["Ес-түссіз", "қалыпты тыныс жоқ немесе тек сирек қырылдаған дем бар", "жауап бермейді"],
  do:["Қауіпсіздікті тексеріңіз.", "Адамды дауыстап шақырып, иығынан түртіңіз.", "103/112 шақырып, телефонды дауысзорайтқышқа қойыңыз.", "Қалыпты тыныс болмаса, кеуде ортасын минутына 100–120 рет, 5–6 см тереңдікке басыңыз.", "Үйретілген болсаңыз, 30 басу мен 2 дем беруді қолданыңыз.", "AED болса, нұсқауын орындаңыз.", "Көмек келгенше жалғастырыңыз."],
  dont:["Тамыр соғысын ұзақ іздемеңіз.", "Ес-түссіз адамға су/дәрі бермеңіз.", "Кеуде басуын себепсіз тоқтатпаңыз."],
  call:["Өмірге тікелей қауіп. Дереу әрекет етіңіз."]},
 {id:"bleed",e:"🩸",t:"Қатты қан кету",u:"r",
  sym:["Қан көп немесе атқылап ағады", "таңғыш/киім тез қанға малынуы", "бозару, суық тер, әлсіздік, естен тану"],
  do:["Қолғап киіңіз.", "Жараны таза дәке/матамен тікелей қатты басыңыз.", "Өмірге қауіпті аяқ-қол қан кетуінде дайын турникетті жарадан жоғары, буынға емес жерге салып, қан тоқтағанша тартыңыз; уақытын белгілеңіз.", "Қадалған затты қозғамаңыз, айналасын таңғышпен бекітіңіз.", "Жатқызып, жылы ұстаңыз және 103/112 шақырыңыз."],
  dont:["Қадалған затты суырмаңыз.", "Турникетті өз бетіңізше босатпаңыз.", "Жараға ұн, кофе, май жақпаңыз.", "Қанға малынған алғашқы таңғышты жұлып алмаңыз."],
  call:["Қатты қан кету – шұғыл жағдай."]},
 {id:"burn",e:"🔥",t:"Күйік",u:"r",
  sym:["Қызару, ауырсыну, көпіршік", "терінің ақ/қоңыр/қаралануы", "үлкен күйікте әлсіздік"],
  do:["Күйік көзін тоқтатыңыз.", "Күйген жерді салқын ағын сумен 20 минут салқындатыңыз.", "Ісіну басталмай тұрып сақина/сағатты шешіңіз.", "Жабыспайтын таза таңғышпен бос жабыңыз.", "Үлкен, терең немесе бет, қол, аяқ, жыныс мүшелері, ірі буындар күйсе, медициналық көмек шақырыңыз."],
  dont:["Мұз қоймаңыз.", "Көпіршікті жармаңыз.", "Май, қаймақ, тіс пастасын жақпаңыз.", "Жабысып қалған киімді жұлып алмаңыз."],
  call:["Тыныс жолы, бет/мойын немесе үлкен аумақ күйсе – дереу жәрдем."]},
 {id:"choke",e:"😮‍💨",t:"Тұншығу (тыныс жолына зат кету)",u:"r",
  sym:["Сөйлей/жөтеле алмау, дыбыссыз жөтел, тыныстың қиындауы, тамағын ұстау, көгеру"],
  do:["Қатты жөтеліп, сөйлей алса, жөтелуіне мүмкіндік беріңіз.", "Толық бітелсе, ересекке алға еңкейтіп жауырын арасына 5 рет соғыңыз; әсер болмаса 5 рет іштен жоғары итеріңіз.", "Кезектестіріңіз.", "Жүкті адамға кеудеден итеру қолданылады.", "Есінен танса, 103/112 шақырып, ЖӨР бастаңыз; ауыздағы көрінетін затты ғана алыңыз."],
  dont:["Көрінбейтін затты саусақпен іздемеңіз.", "Су/тамақ бермеңіз.", "Баланы төңкермеңіз.", "1 жасқа дейінгі нәрестеге іштен итеру жасалмайды: 5 арқа соққысы мен 5 кеуде басуы."],
  call:["Толық бітелу немесе есінен тану – дереу жедел көмек."]},
 {id:"stroke",e:"🧠",t:"Инсульт",u:"r",

 {q:'Күйікке бірінші не істеу керек?',o:['Май жағу','Күйген жерді ағын салқын сумен салқындату','Мұз қою'],a:1,e:'Күйген жерді 20 минутқа дейін ағын салқын сумен салқындатыңыз. Май мен мұз қолданбаңыз.'},
 {q:'Ересек адам тұншығып, жөтеле алмаса, не істейсіз?',o:['Су ішкізу','Жауырын арасына 5 рет соғып, кейін іш аймағына басу әдісін қолдану','Өздігінен өтеді деп күту'],a:1,e:'5 соққы мен 5 басуды алма-кезек қайталап, 112-ге қоңырау шалыңыз.'},
 {q:'Қатты қан кеткенде не істеу керек?',o:['Жараны таза матамен тікелей басу','Жараны спиртпен жуып, күту','Жараға кірген затты суырып алу'],a:0,e:'Жараны таза матамен қатты басып, 112/103-ке қоңырау шалыңыз.'},
 {q:'Талма (құрысу) кезінде не істеуге болмайды?',o:['Айналадағы қауіпті заттарды алу','Адамның аузына қасық немесе саусақ салу','Құрысу уақытын белгілеу'],a:1,e:'Аузына ештеңе салмаңыз, күшпен ұстамаңыз. Басын қорғап, уақытын белгілеңіз.'},
 {q:'Адамның беті қисайып, қолы әлсіреп, сөзі бұзылды. Не істейсіз?',o:['Ұйықтап қалуын күту','Дереу 112/103-ке қоңырау шалу','Үйде дәрі беріп күту'],a:1,e:'Бұл инсульт белгілері. Әр минут маңызды, дереу көмек шақырыңыз.'},
 {q:'Мұрыннан қан кетсе, қалай істеу керек?',o:['Басты артқа шалқайту','Басты алға еңкейтіп, мұрынның жұмсақ бөлігін 10 минут қысу','Мұрынға мақтаны терең тығу'],a:1,e:'Басты алға еңкейтіңіз, мұрынның жұмсақ бөлігін 10 минут тоқтамай қысыңыз.'}
],
ru:[
 {q:'Какой номер единой службы спасения в Казахстане?',o:['112','100','120'],a:0,e:'В экстренной ситуации звоните 112.'},
 {q:'С каким ритмом нужно делать массаж сердца взрослому?',o:['40–60 в минуту','100–120 в минуту','160–180 в минуту'],a:1,e:'Давите на грудную клетку 100–120 раз в минуту на глубину около 5–6 см.'},
 {q:'Что нужно сделать в первую очередь при ожоге?',o:['Смазать маслом','Охладить проточной прохладной водой','Приложить лёд'],a:1,e:'Охлаждайте ожог проточной прохладной водой до 20 минут. Масло и лёд не используйте.'},
 {q:'Взрослый подавился и не может кашлять. Что делать?',o:['Дать воды','5 ударов между лопаток, затем толчки в область живота','Ждать, что пройдёт само'],a:1,e:'Чередуйте 5 ударов и 5 толчков и позвоните 112.'},
 {q:'Что делать при сильном кровотечении?',o:['Прижать рану чистой тканью','Промыть спиртом и ждать','Вытащить предмет из раны'],a:0,e:'Сильно прижмите рану чистой тканью и позвоните 112/103.'},
 {q:'Чего нельзя делать при судорогах (припадке)?',o:['Убрать опасные предметы вокруг','Вкладывать ложку или пальцы в рот','Засечь время судорог'],a:1,e:'Ничего не вкладывайте в рот и не удерживайте силой. Защитите голову и засеките время.'},
 {q:'У человека перекосило лицо, ослабла рука, нарушилась речь. Что делать?',o:['Подождать, пока уснёт','Сразу позвонить 112/103','Дать лекарство и подождать дома'],a:1,e:'Это признаки инсульта. Важна каждая минута: сразу вызывайте помощь.'},
 {q:'Как действовать при носовом кровотечении?',o:['Запрокинуть голову назад','Наклонить голову вперёд и зажать мягкую часть носа на 10 минут','Глубоко засунуть вату в нос'],a:1,e:'Наклоните голову вперёд и без перерыва зажимайте мягкую часть носа 10 минут.'}
],
en:[
 {q:'What is the unified rescue number in Kazakhstan?',o:['112','100','120'],a:0,e:'In an emergency call 112.'},
 {q:'What rhythm should chest compressions have for an adult?',o:['40–60 per minute','100–120 per minute','160–180 per minute'],a:1,e:'Push 100–120 times per minute, about 5–6 cm deep.'},
 {q:'What is the first thing to do for a burn?',o:['Apply oil','Cool it under running cool water','Apply ice'],a:1,e:'Cool the burn under running cool water for up to 20 minutes. Do not use oil or ice.'},
 {q:'An adult is choking and cannot cough. What do you do?',o:['Give water','5 back blows, then abdominal thrusts','Wait for it to pass'],a:1,e:'Alternate 5 blows and 5 thrusts and call 112.'},
 {q:'What should you do for severe bleeding?',o:['Press directly on the wound with a clean cloth','Wash with alcohol and wait','Pull out the object in the wound'],a:0,e:'Press firmly with a clean cloth and call 112/103.'},
 {q:'What must you NOT do during a seizure?',o:['Remove dangerous objects nearby','Put a spoon or fingers in the mouth','Note how long it lasts'],a:1,e:'Never put anything in the mouth or hold the person down. Protect the head and note the time.'},
 {q:'A person has a drooping face, a weak arm and slurred speech. What do you do?',o:['Wait for them to fall asleep','Call 112/103 immediately','Give medicine and wait at home'],a:1,e:'These are stroke signs. Every minute matters: call for help at once.'},
 {q:'What do you do for a nosebleed?',o:['Tilt the head back','Lean forward and pinch the soft part of the nose for 10 minutes','Push cotton deep into the nose'],a:1,e:'Lean forward and pinch the soft part of the nose without stopping for 10 minutes.'}
]
};

</script>
<script>
/* ===== Ескі браузерлерге арналған қосымшалар (polyfill) ===== */
if (!Array.prototype.find) {
  Array.prototype.find = function (f) {
    for (var i = 0; i < this.length; i++) { if (f(this[i], i, this)) return this[i]; }
    return undefined;
  };
}
if (!String.prototype.includes) {
  String.prototype.includes = function (s, p) { return this.indexOf(s, p || 0) !== -1; };
}

function $(s) { return document.querySelector(s); }
function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
var store = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
var ESCMAP = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ESCMAP[c]; }); }
function trim(s) { return String(s).replace(/^\s+|\s+$/g, ''); }

/* ===== Тіл ===== */
var LANGS = ['kk', 'ru', 'en'];
var VOICE_LANG = {kk: 'kk-KZ', ru: 'ru-RU', en: 'en-US'};
var lang = store.get('lang', 'kk');
if (LANGS.indexOf(lang) < 0) lang = 'kk';
function t(k, vars) {
  var s = (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : I18N.kk[k];
  if (typeof s === 'string' && vars) {
    for (var p in vars) { if (vars.hasOwnProperty(p)) s = s.split('{' + p + '}').join(vars[p]); }
  }
  return s;
}
var URGKEY = {r: 'tagR', y: 'tagY', g: 'tagG'};
var URGCLS = {r: 'u-r', y: 'u-y', g: 'u-g'};

var toastTimer = null;
function toast(m) {
  var el = $('#toast'); el.textContent = m; el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.style.display = 'none'; }, 3200);
}

function applyStatic() {
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
  $$('[data-i18n-ph]').forEach(function (el) { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
  $$('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
  document.title = t('appName');
  $('#lang').value = lang;
  $('#btnMetro').textContent = metroTimer ? t('stop') : t('start');
  $('#cprSteps').innerHTML = t('cprSteps').map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('');
}

/* ===== Навигация ===== */
var currentScreen = 'home';
function go(name) {
  currentScreen = name;
  $$('.screen').forEach(function (s) { s.classList.remove('active'); });
  $('#s-' + name).classList.add('active');
  $$('nav button').forEach(function (b) {
    var g = b.getAttribute('data-go');
    var on = g === name || (name === 'detail' && g === 'guides');
    if (on) { b.classList.add('active'); } else { b.classList.remove('active'); }
  });
  window.scrollTo(0, 0);
  if (name !== 'cpr') stopMetro();
  stopSpeech();
}
$$('nav button').forEach(function (b) { b.onclick = function () { go(b.getAttribute('data-go')); }; });
$('#btnBack').onclick = function () { go('guides'); };

/* ===== Тақырып / қаріп ===== */
var root = document.documentElement;
function applyPrefs() {
  root.setAttribute('data-theme', store.get('theme', 'light'));
  root.style.fontSize = store.get('fs', 16) + 'px';
}
$('#btnTheme').onclick = function () { store.set('theme', store.get('theme', 'light') === 'dark' ? 'light' : 'dark'); applyPrefs(); };
$('#btnFont').onclick = function () { var f = store.get('fs', 16); store.set('fs', f >= 22 ? 16 : f + 3); applyPrefs(); };

/* ===== Нұсқаулық тізімі ===== */
function guideView(g) {
  var title = g.t, body = g, translated = true;
  if (lang !== 'kk') {
    var tr = GT[lang];
    if (tr && tr.titles[g.id]) title = tr.titles[g.id];
    if (tr && tr.g[g.id]) { body = tr.g[g.id]; } else { translated = false; }
  }
  return {id: g.id, e: g.e, u: g.u, t: title, sym: body.sym, 'do': body['do'], dont: body.dont, call: body.call, translated: translated};
}
var filter = 'all';
function renderChips() {
  var opts = [['all', 'chipAll'], ['r', 'chipUrgent'], ['y', 'chipImp'], ['g', 'chipLight']];
  $('#chips').innerHTML = opts.map(function (o) {
    return '<button class="chip' + (filter === o[0] ? ' on' : '') + '" data-f="' + o[0] + '">' + esc(t(o[1])) + '</button>';
  }).join('');
  $$('#chips .chip').forEach(function (c) {
    c.onclick = function () { filter = c.getAttribute('data-f'); renderChips(); renderList(); };
  });
}
function renderList() {
  var q = trim($('#q').value).toLowerCase();
  var items = GUIDES.map(guideView).filter(function (g) {
    return (filter === 'all' || g.u === filter) &&
      (!q || g.t.toLowerCase().indexOf(q) !== -1 || g.sym.join(' ').toLowerCase().indexOf(q) !== -1);
  });
  $('#list').innerHTML = items.length ? items.map(function (g) {
    return '<button class="item" data-id="' + g.id + '"><span class="e">' + g.e + '</span><span class="t">' +
      esc(g.t) + '</span><span class="tag ' + URGCLS[g.u] + '">' + esc(t(URGKEY[g.u])) + '</span></button>';
  }).join('') : '<p class="muted">' + esc(t('noResults')) + '</p>';
  $$('#list .item').forEach(function (b) { b.onclick = function () { openGuide(b.getAttribute('data-id')); }; });
}
$('#q').oninput = renderList;

function sec(cls, title, arr, ordered) {
  if (!arr || !arr.length) return '';
  var tag = ordered ? 'ol' : 'ul';
  return '<div class="sec ' + cls + '"><h3>' + esc(title) + '</h3><' + tag + '>' +
    arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</' + tag + '></div>';
}
var currentGuide = null;
function openGuide(id) {
  var raw = GUIDES.find(function (x) { return x.id === id; });
  var g = guideView(raw);
  currentGuide = g;
  $('#detail').innerHTML =
    '<h2 style="margin:0 0 4px">' + g.e + ' ' + esc(g.t) + ' <span class="tag ' + URGCLS[g.u] + '">' + esc(t(URGKEY[g.u])) + '</span></h2>' +
    '<a class="btn red" href="tel:112">' + esc(t('call112')) + '</a>' +
    '<button class="btn gray" id="btnSpeak">' + esc(t('speak')) + '</button>' +
    (g.translated ? '' : '<div class="notr">' + esc(t('notTranslated')) + '</div>') +
    sec('sym', t('secSym'), g.sym, false) +
    sec('do', t('secDo'), g['do'], true) +
    sec('dont', t('secDont'), g.dont, false) +
    sec('call', t('secCall'), g.call, false) +
    '<p class="warn">' + esc(t('guideWarn')) + '</p>';
  $('#btnSpeak').onclick = speakGuide;
  go('detail');
}

/* ===== Дауыспен оқу ===== */
function stopSpeech() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} }
function speakText(text, forceLang) {
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') { toast(t('noTTS')); return; }
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
  var code = VOICE_LANG[forceLang || lang];
  var prefix = code.split('-')[0];
  var voices = speechSynthesis.getVoices();
  var match = voices.find(function (v) { return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; });
  if (voices.length && !match) { toast(t('noVoice')); return; }
  var u = new SpeechSynthesisUtterance(text);
  u.lang = code;
  if (match) { u.voice = match; u.lang = match.lang; }
  speechSynthesis.speak(u);
}
function speakGuide() {
  var g = currentGuide;
  var text = g.t + '. ' + t('secDo') + '. ' + g['do'].map(function (x, i) { return (i + 1) + '. ' + x; }).join(' ') +
    ' ' + t('secDont') + '. ' + (g.dont || []).join(' ');
  speakText(text, g.translated ? lang : 'kk');
}
$('#btnCprSpeak').onclick = function () {
  speakText(t('cprTitle').replace(/^[^\wА-Яа-яӘәҒғҚқҢңӨөҰұҮүІіҺһ]+/, '') + '. ' + t('cprSteps').join(' '));
};
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); } catch (e) {} }

/* ===== Орын және SOS ===== */
var lastLoc = null;
var locState = {kind: 'idle'};
function mapLink() {
  var c = lastLoc.coords;
  return 'https://maps.google.com/?q=' + c.latitude.toFixed(6) + ',' + c.longitude.toFixed(6);
}
function locText() {
  if (!lastLoc) return t('sosMsgNoLoc');
  var med = store.get('med', {});
  var parts = [];
  if (med.blood) parts.push(t('bloodLbl') + ': ' + med.blood);
  if (med.allergy) parts.push(t('allergyLbl') + ': ' + med.allergy);
  return t('sosMsg', {link: mapLink(), m: Math.round(lastLoc.coords.accuracy)}) + (parts.length ? ' ' + parts.join('. ') + '.' : '');
}
function buildSendButtons() {
  var cs = store.get('contacts', []);
  var msg = encodeURIComponent(locText());
  var html = '';
  if (!cs.length) {
    html += '<p class="muted">' + esc(t('addContactsHint')) + '</p>';
    html += '<a class="btn green" href="sms:?&body=' + msg + '">' + esc(t('smsGeneric')) + '</a>';
    html += '<a class="btn" style="background:#128c7e" href="https://wa.me/?text=' + msg + '" target="_blank" rel="noopener">' + esc(t('waGeneric')) + '</a>';
  } else {
    cs.forEach(function (c) {
      var ph = c.phone.replace(/[^\d+]/g, '');
      var wa = ph.replace(/\D/g, '');
      html += '<a class="btn green" href="sms:' + ph + '?&body=' + msg + '">💬 ' + esc(c.name) + ': ' + esc(t('smsTo')) + '</a>';
      html += '<a class="btn" style="background:#128c7e" href="https://wa.me/' + wa + '?text=' + msg + '" target="_blank" rel="noopener">🟢 ' + esc(c.name) + ': ' + esc(t('waTo')) + '</a>';
    });
  }
  $('#sendBox').innerHTML = html;
}
function renderLoc() {
  var el = $('#locStatus');
  if (locState.kind === 'finding') { el.textContent = t('locFinding'); return; }
  if (locState.kind === 'ok') {
    var c = lastLoc.coords;
    el.innerHTML = esc(t('locFound', {m: Math.round(c.accuracy)})) + '<br><a href="' + mapLink() + '" target="_blank" rel="noopener">' + esc(t('viewMap')) + '</a>';
  } else if (locState.kind === 'err') {
    el.textContent = '⚠️ ' + t(locState.key) + ' ' + t('sayAddress');
  } else { el.textContent = ''; }
  if (locState.kind === 'ok' || locState.kind === 'err') buildSendButtons();
}
function getLocation() {
  locState = {kind: 'finding'}; renderLoc();
  if (window.isSecureContext === false) { locState = {kind: 'err', key: 'locInsecure'}; renderLoc(); return; }
  if (!navigator.geolocation) { locState = {kind: 'err', key: 'locNoSupport'}; renderLoc(); return; }
  navigator.geolocation.getCurrentPosition(function (pos) {
    lastLoc = pos; locState = {kind: 'ok'}; renderLoc();
  }, function (err) {
    locState = {kind: 'err', key: err.code === 1 ? 'locDenied' : 'locFail'}; renderLoc();
  }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 0});
}
$('#btnSOS').onclick = function () {
  if (navigator.vibrate) navigator.vibrate(200);
  var p = $('#panelSOS');
  p.style.display = 'block';
  buildSendButtons();
  try { p.scrollIntoView({behavior: 'smooth'}); } catch (e) { p.scrollIntoView(); }
  getLocation();
};
function copyText(text, done, fail) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done, fail); });
    return;
  }
  legacyCopy(text, done, fail);
}
function legacyCopy(text, done, fail) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) { done(); } else { fail(); }
  } catch (e) { fail(); }
}
$('#btnCopyLoc').onclick = function () {
  copyText(locText(), function () { toast(t('copied')); }, function () { toast(t('copyFail')); });
};

/* ===== Жақындар және мед.карта ===== */
function renderContacts() {
  var cs = store.get('contacts', []);
  $('#contactList').innerHTML = cs.length ? cs.map(function (c, i) {
    return '<div class="contact"><span><b>' + esc(c.name) + '</b><br><span class="muted">' + esc(c.phone) + '</span></span><button data-i="' + i + '" aria-label="' + esc(t('delAria')) + '">🗑</button></div>';
  }).join('') : '<p class="muted">' + esc(t('ctNone')) + '</p>';
  $$('#contactList button').forEach(function (b) {
    b.onclick = function () {
      var a = store.get('contacts', []);
      a.splice(parseInt(b.getAttribute('data-i'), 10), 1);
      store.set('contacts', a); renderContacts(); buildSendButtons();
    };
  });
}
$('#btnAddContact').onclick = function () {
  var name = trim($('#cName').value), phone = trim($('#cPhone').value);
  if (!name || phone.replace(/\D/g, '').length < 10) { toast(t('ctInvalid')); return; }
  var a = store.get('contacts', []);
  if (a.length >= 5) { toast(t('ctMax')); return; }
  a.push({name: name, phone: phone}); store.set('contacts', a);
  $('#cName').value = ''; $('#cPhone').value = ''; renderContacts(); toast(t('ctAdded'));
};
function loadMed() {
  var m = store.get('med', {});
  $('#mBlood').value = m.blood || ''; $('#mAllergy').value = m.allergy || ''; $('#mMeds').value = m.meds || '';
}
$('#btnSaveMed').onclick = function () {
  store.set('med', {blood: trim($('#mBlood').value), allergy: trim($('#mAllergy').value), meds: trim($('#mMeds').value)});
  toast(t('saved'));
};

/* ===== Резервтік көшірме ===== */
function backupJSON() {
  return JSON.stringify({app: 'sos-komek', v: 1, contacts: store.get('contacts', []), med: store.get('med', {})});
}
function applyBackup(text) {
  try {
    var d = JSON.parse(trim(text));
    if (!d || d.app !== 'sos-komek') throw new Error('bad');
    var cs = [];
    (d.contacts || []).slice(0, 5).forEach(function (c) {
      if (c && typeof c.name === 'string' && typeof c.phone === 'string') cs.push({name: c.name.slice(0, 60), phone: c.phone.slice(0, 30)});
    });
    var m = d.med || {};
    store.set('contacts', cs);
    store.set('med', {blood: String(m.blood || '').slice(0, 60), allergy: String(m.allergy || '').slice(0, 120), meds: String(m.meds || '').slice(0, 200)});
    renderContacts(); loadMed(); toast(t('bkDone'));
  } catch (e) { toast(t('bkBad')); }
}
$('#btnExport').onclick = function () {
  try {
    var blob = new Blob([backupJSON()], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'sos-komek-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast(t('bkExported'));
  } catch (e) { toast(t('copyFail')); }
};
$('#btnBackupCopy').onclick = function () {
  copyText(backupJSON(), function () { toast(t('copied')); }, function () { $('#backupText').value = backupJSON(); toast(t('copyFail')); });
};
$('#fileImport').onchange = function () {
  var f = this.files && this.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () { applyBackup(String(r.result)); };
  r.onerror = function () { toast(t('bkBad')); };
  r.readAsText(f);
  this.value = '';
};
$('#btnRestore').onclick = function () { applyBackup($('#backupText').value); $('#backupText').value = ''; };

$('#btnShare').onclick = function () {
  if (navigator.share) {
    try { navigator.share({title: t('appName'), text: t('shareDesc'), url: location.href}); } catch (e) {}
  } else {
    copyText(location.href, function () { toast(t('linkCopied')); }, function () { toast(location.href); });
  }
};

/* ===== CPR метроном ===== */
var metroTimer = null, actx = null;
function beep() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    var o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880; g.gain.value = 0.25; o.connect(g); g.connect(actx.destination);
    o.start(0); o.stop(actx.currentTime + 0.06);
  } catch (e) {}
}
function tick() {
  beep(); if (navigator.vibrate) navigator.vibrate(40);
  var b = $('#beat'); b.classList.add('on');
  setTimeout(function () { b.classList.remove('on'); }, 90);
}
function startMetro() {
  var bpm = parseInt($('#bpmRange').value, 10);
  tick(); metroTimer = setInterval(tick, 60000 / bpm);
  $('#btnMetro').textContent = t('stop');
}
function stopMetro() {
  if (metroTimer) { clearInterval(metroTimer); metroTimer = null; }
  var b = $('#btnMetro'); if (b) b.textContent = t('start');
}
$('#btnMetro').onclick = function () { if (metroTimer) { stopMetro(); } else { startMetro(); } };
$('#bpmRange').oninput = function () {
  $('#bpm').textContent = this.value;
  if (metroTimer) { stopMetro(); startMetro(); }
};

/* ===== Тест ===== */
var quiz = {i: 0, score: 0, answered: false, started: false, done: false};
function renderQuiz() {
  var qs = QUIZ[lang] || QUIZ.kk, box = $('#quizBox'), total = qs.length;
  var best = store.get('quizBest', null);
  var bestLine = best !== null ? '<p class="muted">' + esc(t('quizBest', {b: best, t: total})) + '</p>' : '';
  if (!quiz.started) {
    box.innerHTML = '<h2>' + esc(t('quizTitle')) + '</h2><p class="muted">' + esc(t('quizIntro')) + '</p>' + bestLine +
      '<button class="btn green" id="qStart">' + esc(t('quizStart')) + '</button>';
    $('#qStart').onclick = function () { quiz = {i: 0, score: 0, answered: false, started: true, done: false}; renderQuiz(); };
    return;
  }
  if (quiz.done) {
    box.innerHTML = '<h2>' + esc(t('quizTitle')) + '</h2><div class="qscore">' + esc(t('result', {s: quiz.score, t: total})) + '</div>' + bestLine +
      '<button class="btn green" id="qAgain">' + esc(t('again')) + '</button>';
    $('#qAgain').onclick = function () { quiz = {i: 0, score: 0, answered: false, started: true, done: false}; renderQuiz(); };
    return;
  }
  var q = qs[quiz.i];
  var html = '<div class="qprog">' + esc(t('quizQ', {n: quiz.i + 1, t: total})) + '</div><div class="qtext">' + esc(q.q) + '</div>';
  q.o.forEach(function (o, idx) {
    var cls = 'opt';
    if (quiz.answered) { if (idx === q.a) cls += ' ok'; else if (idx === quiz.picked) cls += ' no'; }
    html += '<button class="' + cls + '" data-i="' + idx + '">' + esc(o) + '</button>';
  });
  if (quiz.answered) {
    html += '<div class="qexp"><b>' + esc(quiz.picked === q.a ? t('correct') : t('wrong')) + '</b> ' + esc(q.e) + '</div>';
    html += '<button class="btn" id="qNext">' + esc(quiz.i + 1 >= total ? t('quizFinish') : t('next')) + '</button>';
  }
  box.innerHTML = html;
  if (!quiz.answered) {
    $$('#quizBox .opt').forEach(function (b) {
      b.onclick = function () {
        quiz.picked = parseInt(b.getAttribute('data-i'), 10);
        quiz.answered = true;
        if (quiz.picked === q.a) quiz.score++;
        renderQuiz();
      };
    });
  } else {
    $('#qNext').onclick = function () {
      quiz.answered = false; quiz.i++;
      if (quiz.i >= total) {
        quiz.done = true;
        var b = store.get('quizBest', null);
        if (b === null || quiz.score > b) store.set('quizBest', quiz.score);
      }
      renderQuiz();
    };
  }
}

/* ===== Тіл ауыстыру ===== */
function renderAll() {
  applyStatic(); renderChips(); renderList(); renderContacts(); renderQuiz(); renderLoc();
  if ($('#panelSOS').style.display === 'block') buildSendButtons();
  if (currentScreen === 'detail' && currentGuide) openGuide(currentGuide.id);
}
$('#lang').onchange = function () {
  lang = this.value; store.set('lang', lang); stopSpeech(); renderAll();
};

applyPrefs();
loadMed();
renderAll();

  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').then(null, function () {}); });
}
