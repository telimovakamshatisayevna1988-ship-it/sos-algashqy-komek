<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c62828">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>SOS Көмек</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 data-i18n="appName">SOS Көмек</h1>
  <div class="tools">
    <select id="lang" aria-label="Language">
      <option value="kk">ҚАЗ</option>
      <option value="ru">РУС</option>
      <option value="en">ENG</option>
    </select>
    <button id="btnTheme" data-i18n-aria="themeAria" aria-label="Түнгі режим">🌙</button>
    <button id="btnFont" data-i18n-aria="fontAria" aria-label="Қаріпті үлкейту">A+</button>
  </div>
</header>

<main>
  <!-- БАСТЫ -->
  <section id="s-home" class="screen active">
    <div class="sos-wrap">
      <button class="sos" id="btnSOS"><span class="sos-t">SOS</span><small data-i18n="tapHere">басыңыз</small></button>
    </div>
    <a class="btn yellow big" href="tel:112" data-i18n="call112">📞 112-ге қоңырау шалу</a>
    <p class="muted center" data-i18n="homeHint"></p>

    <div class="card" id="panelSOS" style="display:none">
      <h2 data-i18n="panelTitle"></h2>
      <a class="btn red" href="tel:112" data-i18n="call112"></a>
      <div id="locStatus" class="muted" style="margin-top:10px"></div>
      <div id="sendBox"></div>
      <button class="btn gray" id="btnCopyLoc" data-i18n="copyLoc"></button>
      <p class="muted" data-i18n="callTell"></p>
    </div>

    <h2 class="h2s" data-i18n="numbersTitle"></h2>
    <div class="grid">
      <a class="num" href="tel:112"><b>112</b><span data-i18n="n112"></span></a>
      <a class="num" href="tel:103"><b>103</b><span data-i18n="n103"></span></a>
      <a class="num" href="tel:101"><b>101</b><span data-i18n="n101"></span></a>
      <a class="num" href="tel:102"><b>102</b><span data-i18n="n102"></span></a>
    </div>
    <p class="warn" data-i18n="disclaimer"></p>
  </section>

  <!-- НҰСҚАУЛЫҚ ТІЗІМІ -->
  <section id="s-guides" class="screen">
    <input type="search" id="q" data-i18n-ph="searchPh">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <!-- НҰСҚАУЛЫҚ ТОЛЫҚ -->
  <section id="s-detail" class="screen">
    <button class="back" id="btnBack" data-i18n="back"></button>
    <div id="detail"></div>
  </section>

  <!-- CPR -->
  <section id="s-cpr" class="screen">
    <div class="card metro">
      <h2 data-i18n="cprTitle"></h2>
      <p class="muted" data-i18n="cprDesc"></p>
      <div class="beat" id="beat"></div>
      <div class="bpmline"><span id="bpm">110</span> <span data-i18n="bpmUnit"></span></div>
      <input type="range" id="bpmRange" min="100" max="120" value="110" class="range" aria-label="BPM">
      <button class="btn red" id="btnMetro" data-i18n="start"></button>
      <a class="btn gray" href="tel:112" data-i18n="cprCallFirst"></a>
    </div>
    <div class="card">
      <h2 data-i18n="cprStepsTitle"></h2>
      <ol id="cprSteps"></ol>
      <p class="muted" data-i18n="cprNote"></p>
      <button class="btn gray" id="btnCprSpeak" data-i18n="cprSpeak"></button>
    </div>
  </section>

  <!-- ТЕСТ -->
  <section id="s-quiz" class="screen">
    <div class="card" id="quizBox"></div>
  </section>

  <!-- ЖАҚЫНДАР -->
  <section id="s-contacts" class="screen">
    <div class="card">
      <h2 data-i18n="ctTitle"></h2>
      <p class="muted" data-i18n="ctDesc"></p>
      <div id="contactList"></div>
      <input type="text" id="cName" data-i18n-ph="namePh">
      <input type="tel" id="cPhone" data-i18n-ph="phonePh">
      <button class="btn green" id="btnAddContact" data-i18n="add"></button>
    </div>
    <div class="card">
      <h2 data-i18n="medTitle"></h2>
      <p class="muted" data-i18n="medDesc"></p>
      <input type="text" id="mBlood" data-i18n-ph="bloodPh">
      <input type="text" id="mAllergy" data-i18n-ph="allergyPh">
      <input type="text" id="mMeds" data-i18n-ph="medsPh">
      <button class="btn green" id="btnSaveMed" data-i18n="save"></button>
    </div>
    <div class="card">
      <h2 data-i18n="bkTitle"></h2>
      <p class="muted" data-i18n="bkDesc"></p>
      <button class="btn" id="btnExport" data-i18n="bkExport"></button>
      <button class="btn gray" id="btnBackupCopy" data-i18n="bkCopy"></button>
      <label class="btn gray filebtn" for="fileImport" data-i18n="bkImportFile"></label>
      <input type="file" id="fileImport" accept=".json,application/json,text/plain" class="hidefile">
      <textarea id="backupText" rows="3" data-i18n-ph="bkPastePh"></textarea>
      <button class="btn gray" id="btnRestore" data-i18n="bkRestore"></button>
    </div>
    <div class="card">
      <h2 data-i18n="shareTitle"></h2>
      <p class="muted" data-i18n="shareDesc"></p>
      <button class="btn" id="btnShare" data-i18n="shareBtn"></button>
    </div>
  </section>
</main>

<nav>
  <button data-go="home" class="active"><span class="i">🆘</span><span data-i18n="navSOS">SOS</span></button>
  <button data-go="guides"><span class="i">📖</span><span data-i18n="navGuides"></span></button>
  <button data-go="cpr"><span class="i">❤️</span><span data-i18n="navCPR">CPR</span></button>
  <button data-go="quiz"><span class="i">📝</span><span data-i18n="navQuiz"></span></button>
  <button data-go="contacts"><span class="i">👤</span><span data-i18n="navMe"></span></button>
</nav>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
